<section class="mx-auto max-w-lg space-y-6">
  <div>
    <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Account</h1>
    <p class="mt-2 text-sm text-slate-600">
      This page is behind <code>authGuard</code>. Replace it with your signed-in area.
    </p>
  </div>

  @if (auth.user(); as user) {
    <dl class="rounded-2xl border border-slate-200 bg-white p-5 text-sm">
      <div class="flex justify-between gap-4 py-2">
        <dt class="text-slate-500">Email</dt>
        <dd class="font-medium text-slate-900">{{ user.email }}</dd>
      </div>
      <div class="flex justify-between gap-4 py-2">
        <dt class="text-slate-500">User id</dt>
        <dd class="font-medium text-slate-900">{{ user.id }}</dd>
      </div>
      <div class="flex justify-between gap-4 py-2">
        <dt class="text-slate-500">Created</dt>
        <dd class="font-medium text-slate-900">{{ user.created_at | date: 'medium' }}</dd>
      </div>
    </dl>
  } @else {
    <p class="text-sm text-slate-600">Loading session…</p>
  }

  @if (error()) {
    <p class="rounded-xl bg-red-50 px-3 py-2 text-sm text-red-700">{{ error() }}</p>
  }

  <div class="flex flex-wrap gap-3">
    <button
      type="button"
      class="rounded-full bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700"
      (click)="auth.logout()"
    >
      Log out
    </button>
    <button
      type="button"
      class="rounded-full border border-red-200 px-4 py-2 text-sm font-medium text-red-700 hover:bg-red-50"
      [disabled]="pending()"
      (click)="removeAccount()"
    >
      Delete account
    </button>
  </div>
</section>
