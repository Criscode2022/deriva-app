<section class="mx-auto max-w-md">
  <h1 class="text-2xl font-semibold tracking-tight text-slate-900">
    {{ mode() === 'login' ? 'Sign in' : 'Create an account' }}
  </h1>
  <p class="mt-2 text-sm text-slate-600">
    Email and password. Sessions are stored in Neon and sent as a Bearer token.
  </p>

  <form class="mt-8 space-y-4" (submit)="submit($event)">
    <label class="block space-y-1.5">
      <span class="text-sm font-medium text-slate-700">Email</span>
      <input
        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 outline-none ring-sky-600 focus:ring-2"
        type="email"
        autocomplete="email"
        required
        [value]="email()"
        (input)="email.set($any($event.target).value)"
      />
    </label>
    <label class="block space-y-1.5">
      <span class="text-sm font-medium text-slate-700">Password</span>
      <input
        class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 outline-none ring-sky-600 focus:ring-2"
        type="password"
        autocomplete="current-password"
        minlength="8"
        required
        [value]="password()"
        (input)="password.set($any($event.target).value)"
      />
    </label>

    @if (error()) {
      <p class="rounded-xl bg-red-50 px-3 py-2 text-sm text-red-700">{{ error() }}</p>
    }

    <button
      type="submit"
      class="w-full rounded-full bg-slate-900 px-4 py-2.5 text-sm font-medium text-white hover:bg-slate-700 disabled:opacity-60"
      [disabled]="pending()"
    >
      {{ pending() ? 'Please wait…' : mode() === 'login' ? 'Sign in' : 'Register' }}
    </button>
  </form>

  <button type="button" class="mt-4 text-sm font-medium text-sky-700" (click)="toggleMode()">
    {{ mode() === 'login' ? 'Need an account? Register' : 'Already registered? Sign in' }}
  </button>
</section>
