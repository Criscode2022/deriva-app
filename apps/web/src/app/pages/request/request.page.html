<section class="mx-auto grid max-w-5xl gap-10 px-6 py-12 md:grid-cols-2">
  <div>
    <p class="text-xs uppercase tracking-[0.16em] text-terracotta">Solicitud</p>
    <h1 class="mt-3 font-serif text-4xl">Pedir plaza</h1>
    <p class="mt-3 text-sm">No reserva el hueco. El guía escribe si hay sitio.</p>
  </div>
  <form class="flex flex-col gap-3 bg-white p-6" (submit)="submit($event)">
    <label class="text-sm">Nombre
      <input class="mt-1 w-full border border-ink px-3 py-2" [value]="name()" (input)="name.set($any($event.target).value)" required />
    </label>
    <label class="text-sm">Email
      <input type="email" class="mt-1 w-full border border-ink px-3 py-2" [value]="email()" (input)="email.set($any($event.target).value)" required />
    </label>
    <label class="text-sm">Personas
      <input type="number" min="1" max="12" class="mt-1 w-full border border-ink px-3 py-2" [value]="partySize()" (input)="setPartySize($any($event.target).value)" />
    </label>
    @if (error()) {
      <p class="text-sm text-terracotta">{{ error() }}</p>
    }
    <button class="bg-terracotta py-3 text-cream" [disabled]="pending()">Enviar solicitud</button>
  </form>
</section>
